version: 1

# Public measurement datasets used by `agentic-ran prepare-real-data`.
# Raw files are downloaded at runtime and are not redistributed by this repository.
# Prepared CSV.GZ outputs preserve source identifiers and measured/derived feature metadata.
sources:
  - id: telenor-forest-private-5g
    enabled: true
    title: Radio and Network KPI measurements for 5G Private Network in Forest Environment
    publisher: Telenor Norway / COMMECT
    doi: 10.5281/zenodo.16919567
    record_url: https://zenodo.org/records/16919567
    download_url: https://zenodo.org/api/records/16919567/files/data_forestry.xlsx/content
    filename: data_forestry.xlsx
    format: xlsx
    md5: e3b36c7df1ac82e6034feda882e33ad0
    license: source-record
    notes: >-
      Field-trial measurements from a portable 5G private network. Useful measured
      fields include RSRP, downlink/uplink throughput, latency and jitter.

  - id: glasgow-5g-2025
    enabled: true
    title: Glasgow 5G Dataset 2025
    publisher: University of the West of Scotland
    doi: 10.5281/zenodo.20465872
    record_url: https://zenodo.org/records/20465872
    download_url: https://zenodo.org/api/records/20465872/files/Glasgow5GDataSet.xlsx/content
    filename: Glasgow5GDataSet.xlsx
    format: xlsx
    md5: 375c58bd79d1e0762724fb78f67b4230
    license: CC-BY-4.0
    notes: >-
      Real-world 5G speed-test measurements across Glasgow. Measured fields include
      signal strength, download/upload throughput and ping latency.

  # Research-grade extended source. Disabled from the default smoke workflow because
  # the current archive is ~786 MB and contains multiple CSV/Parquet sub-datasets.
  # It is catalogued here for future dedicated Vienna/digital-twin adapters.
  - id: vienna-4g-5g-drive-test-v3
    enabled: false
    title: The Vienna 4G/5G Drive-Test Dataset
    publisher: TU Wien / CD LAB AIRAN
    doi: 10.5281/zenodo.18338399
    concept_doi: 10.5281/zenodo.18322065
    record_url: https://zenodo.org/records/18338399
    download_url: https://zenodo.org/api/records/18338399/files/Vienna-full-4G-5G-dataset-v1.0.3.zip/content
    filename: Vienna-full-4G-5G-dataset-v1.0.3.zip
    format: zip
    md5: cc956eff3c633c03abc5b9a126f73911
    license: CC-BY-4.0
    profile: extended
    notes: >-
      Large-scale Vienna scanner and handset measurements with RSRP/RSRQ/SINR,
      throughput, mobility metadata, inferred cell descriptors and optional city model.
      Intentionally excluded from the small default Docker smoke benchmark.
