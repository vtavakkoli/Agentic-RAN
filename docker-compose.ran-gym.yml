name: agentic-ran-gym
x-base: &base
  build:
    context: .
    dockerfile: Dockerfile.ran-gym
    target: runtime
  environment:
    PYTHONUNBUFFERED: "1"
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  volumes:
    - ./results:/workspace/results
    - ./artifacts:/workspace/artifacts:ro
    - ./configs:/workspace/configs:ro
  restart: "no"

services:
  ran-gym-unit:
    <<: *base
    entrypoint: ["python", "-m", "pytest"]
    command: ["-q", "tests/test_ran_gym_benchmark.py"]

  ran-gym-smoke:
    <<: *base
    entrypoint: ["python", "-m", "agentic_ran.research_ran_gym"]
    command: ["--config", "/workspace/configs/ran_gym_smoke.json", "--output", "/workspace/results/ran-gym-smoke"]


  # Executes Gymnasium's 5-action toy RAN, not native NR PHY.
  ran-gym-final-test:
    <<: *base
    build:
      context: .
      dockerfile: Dockerfile.ran-gym
      target: final-algorithms
    entrypoint: ["python", "-m", "pytest"]
    command: ["-q", "tests/test_ran_gym_final_algorithms.py"]

  ran-gym-final-smoke:
    <<: *base
    build:
      context: .
      dockerfile: Dockerfile.ran-gym
      target: final-algorithms
    entrypoint: ["python", "-m", "agentic_ran.research_ran_gym_final_algorithms"]
    command: ["--output", "/workspace/results/ran-gym-final-smoke", "--ppo-updates", "1", "--episodes-per-update", "2", "--logged-episodes", "12", "--validation-episodes", "4", "--test-seeds", "4", "--steps", "5", "--wsp-rounds", "1", "--critic-iterations", "1"]

  ran-gym-final-algorithms:
    <<: *base
    build:
      context: .
      dockerfile: Dockerfile.ran-gym
      target: final-algorithms
    entrypoint: ["python", "-m", "agentic_ran.research_ran_gym_final_algorithms"]
    command: ["--output", "/workspace/results/ran-gym-final-algorithms", "--seed", "2026", "--ppo-updates", "20", "--episodes-per-update", "8", "--logged-episodes", "72", "--validation-episodes", "12", "--test-seeds", "20", "--steps", "24", "--wsp-rounds", "2", "--critic-iterations", "3"]

  # Research-scale independent training seeds and paired scenario tests.
  # Runs in Python 3.13 CPU PyTorch; strictly TOY Gymnasium, not NR PHY.
  ran-gym-campaign:
    <<: *base
    build:
      context: .
      dockerfile: Dockerfile.ran-gym
      target: final-algorithms
    entrypoint: ["python", "-m", "agentic_ran.research_ran_gym_campaign"]
    command:
      - --output
      - /workspace/results/${RAN_GYM_CAMPAIGN_NAME:-ran-gym-campaign}
      - --training-runs
      - "${RAN_GYM_TRAINING_RUNS:-10}"
      - --test-seeds
      - "${RAN_GYM_TEST_SEEDS:-40}"
      - --ppo-updates
      - "${RAN_GYM_PPO_UPDATES:-48}"
      - --episodes-per-update
      - "${RAN_GYM_PPO_EPISODES_PER_UPDATE:-12}"
      - --logged-episodes
      - "${RAN_GYM_LOGGED_EPISODES:-120}"
      - --validation-episodes
      - "${RAN_GYM_VALIDATION_EPISODES:-24}"
      - --steps
      - "${RAN_GYM_STEPS:-32}"
      - --wsp-rounds
      - "${RAN_GYM_WSP_ROUNDS:-3}"
      - --critic-iterations
      - "${RAN_GYM_CRITIC_ITERATIONS:-5}"

  # Small repeatable Docker CI smoke; not evidence for IEEE Access claims.
  ran-gym-campaign-smoke:
    <<: *base
    build:
      context: .
      dockerfile: Dockerfile.ran-gym
      target: final-algorithms
    entrypoint: ["python", "-m", "agentic_ran.research_ran_gym_campaign"]
    command: ["--output", "/workspace/results/${RAN_GYM_SMOKE_NAME:-ran-gym-campaign-smoke}", "--training-runs", "2", "--test-seeds", "4", "--ppo-updates", "1", "--episodes-per-update", "2", "--logged-episodes", "12", "--validation-episodes", "4", "--steps", "5", "--wsp-rounds", "1", "--critic-iterations", "1", "--smoke"]

  ran-gym-campaign-test:
    <<: *base
    build:
      context: .
      dockerfile: Dockerfile.ran-gym
      target: final-algorithms
    entrypoint: ["python", "-m", "pytest"]
    command: ["-q", "tests/test_ran_gym_campaign.py"]

  # Verified ns-3.49 CMake/ZeroMQ/Protobuf physical UDP packet simulator.
  # This is NOT an NR scheduler or COMMAG PRB experiment.
  ran-gym-modern-ns3-smoke:
    profiles: ["native"]
    <<: *base
    build:
      context: .
      dockerfile: Dockerfile.ran-gym
      target: modern-ns3
      args:
        MODERN_NS3_BUILD_JOBS: "${MODERN_NS3_BUILD_JOBS:-4}"
    init: true
    entrypoint: ["python3.13", "-m", "agentic_ran.research_modern_ns3_container_smoke"]
    command: ["--output", "${AGENTIC_RAN_NATIVE_REPORT_PATH:-/workspace/results/modern-ns3/real_closed_loop.json}", "--horizon", "5"]

  # External site adapters remain opt-in for a separately validated COMMAG
  # PRB/scheduler use case. The verified generic UDP example must NOT be
  # silently substituted into this research publication pipeline.
  ran-gym-active:
    profiles: ["external"]
    <<: *base
    build:
      context: .
      dockerfile: Dockerfile.ran-gym
      target: runtime
    init: true
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "/workspace/site-adapters"
    volumes:
      - ./results:/workspace/results
      - ./artifacts:/workspace/artifacts:ro
      - ./configs:/workspace/configs:ro
      - ./external/site-adapters:/workspace/site-adapters:ro
    entrypoint: ["python", "-m", "agentic_ran.research_ran_gym"]
    command: ["--config", "/workspace/configs/ran_gym_active.json", "--output", "/workspace/results/ran-gym-active"]

  publication-final-gate:
    <<: *base
    entrypoint: ["python", "-m", "agentic_ran.research_publication_gate"]
    command:
      - --offline
      - /workspace/results/publication/publication_summary.json
      - --active
      - /workspace/results/ran-gym-active/ran_gym_summary.json
      - --output
      - /workspace/results/publication/final_evidence_gate.json
