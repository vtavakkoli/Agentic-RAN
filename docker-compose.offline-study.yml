name: agentic-ran-offline-study

x-study: &study
  build:
    context: .
    dockerfile: Dockerfile
  image: agentic-ran:offline-study
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  environment:
    PYTHONUNBUFFERED: "1"
  volumes:
    - ./data:/workspace/data
    - ./artifacts:/workspace/artifacts
    - ./results:/workspace/results
  restart: "no"

services:
  prepare-data:
    <<: *study
    entrypoint: ["agentic-ran"]
    command:
      - prepare-commag
      - --raw-dir
      - /workspace/data/raw/commag
      - --output
      - /workspace/data/prepared/commag
      - --base-stations
      - ${AGENTIC_RAN_COMMAG_BASE_STATIONS:-1,4}
      - --workers
      - ${AGENTIC_RAN_COMMAG_WORKERS:-4}

  prepare-report:
    <<: *study
    depends_on:
      prepare-data:
        condition: service_completed_successfully
    entrypoint: ["python", "-m", "agentic_ran.offline_policy"]
    command:
      - prepare-report
      - --data
      - /workspace/data/prepared/commag/commag_transitions.csv.gz
      - --manifest
      - /workspace/data/prepared/commag/commag_manifest.json
      - --output
      - /workspace/results/prepare-data

  train:
    <<: *study
    depends_on:
      prepare-report:
        condition: service_completed_successfully
    entrypoint: ["python", "-m", "agentic_ran.offline_policy"]
    command:
      - train
      - --data
      - /workspace/data/prepared/commag/commag_transitions.csv.gz
      - --artifacts
      - /workspace/artifacts/offline-policy
      - --output
      - /workspace/results/train
      - --config
      - /workspace/configs/offline_policy.yaml
      - --seed
      - "42"

  test:
    <<: *study
    depends_on:
      train:
        condition: service_completed_successfully
    entrypoint: ["python", "-m", "agentic_ran.offline_policy"]
    command:
      - evaluate
      - --data
      - /workspace/data/prepared/commag/commag_transitions.csv.gz
      - --artifacts
      - /workspace/artifacts/offline-policy
      - --output
      - /workspace/results/test
      - --seeds
      - ${AGENTIC_RAN_STUDY_SEEDS:-30}
      - --base-seed
      - ${AGENTIC_RAN_STUDY_BASE_SEED:-1000}
