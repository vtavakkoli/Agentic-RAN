name: agentic-ran-publication

x-study: &study
  build:
    context: .
    dockerfile: Dockerfile
  image: agentic-ran:publication
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  environment:
    PYTHONUNBUFFERED: "1"
    AGENTIC_RAN_EXPERIMENTAL_SUPPORT_GUARD: "${AGENTIC_RAN_EXPERIMENTAL_SUPPORT_GUARD:-0}"
    AGENTIC_RAN_EVAL_MATCHED_WRAPPERS: "${AGENTIC_RAN_EVAL_MATCHED_WRAPPERS:-0}"
    AGENTIC_RAN_EVAL_CONFORMAL_RERANK: "${AGENTIC_RAN_EVAL_CONFORMAL_RERANK:-0}"
  volumes:
    - ./data:/workspace/data
    - ./artifacts:/workspace/artifacts
    - ./results:/workspace/results
  restart: "no"

services:
  prepare-full-commag:
    <<: *study
    entrypoint: ["python", "-m", "agentic_ran.publication"]
    command:
      - prepare
      - --raw-dir
      - /workspace/data/raw/commag
      - --output
      - /workspace/data/prepared/commag-publication
      - --config
      - /workspace/configs/full_commag_publication.yaml
      - --workers
      - ${AGENTIC_RAN_COMMAG_WORKERS:-4}

  publication-test:
    <<: *study
    depends_on:
      prepare-full-commag:
        condition: service_completed_successfully
    entrypoint: ["python", "-m", "agentic_ran.publication"]
    command:
      - evaluate
      - --data
      - /workspace/data/prepared/commag-publication/commag_publication_transitions.csv.gz
      - --output
      - /workspace/results/publication
      - --config
      - /workspace/configs/full_commag_publication.yaml
      - --science-config
      - /workspace/configs/final_publication.yaml
      - --seed
      - ${AGENTIC_RAN_PUBLICATION_SEED:-2026}
