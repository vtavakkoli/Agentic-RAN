version: '3.9'

x-common: &common
  build: .
  image: agentic-ran:latest
  volumes:
    - ./shared_data:/app/shared_data

services:
  lightweight-32:
    <<: *common
    command: python xapp_agent.py --model_type lightweight-32 --features 6 --epochs 8

  lightweight-64:
    <<: *common
    command: python xapp_agent.py --model_type lightweight-64 --features 6 --epochs 8

  balanced-small:
    <<: *common
    command: python xapp_agent.py --model_type balanced-small --features 8 --epochs 8

  balanced-medium:
    <<: *common
    command: python xapp_agent.py --model_type balanced-medium --features 8 --epochs 8

  deep-performance:
    <<: *common
    command: python xapp_agent.py --model_type deep-performance --features 10 --epochs 8

  ultra-performance:
    <<: *common
    command: python xapp_agent.py --model_type ultra-performance --features 16 --epochs 8

  attention-baseline:
    <<: *common
    command: python xapp_agent.py --model_type attention-baseline --features 8 --epochs 8

  liquid-baseline:
    <<: *common
    command: python xapp_agent.py --model_type liquid-baseline --features 6 --epochs 8
