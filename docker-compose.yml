x-common: &common
  build: .
  image: agentic-ran:latest
  volumes:
    - ./:/app
  working_dir: /app
  environment:
    EPOCHS: ${EPOCHS:-5}
    PYTHONPATH: /app

services:
  generate_data:
    <<: *common
    command: python -m scripts.generate_data

  train:
    <<: *common
    command: python -m scripts.train

  test:
    <<: *common
    command: python -m scripts.test

  run-all:
    <<: *common
    command: python -m scripts.run_all
