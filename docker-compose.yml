x-common: &common
  build: .
  image: agentic-ran:latest
  volumes:
    - ./agentic_ran:/app/agentic_ran
    - ./scripts:/app/scripts
    - ./src:/app/src
    - ./models:/app/models
    - ./policies:/app/policies
    - ./configs:/app/configs
    - ./shared_data:/app/shared_data
    - ./results:/app/results
  environment:
    EPOCHS: ${EPOCHS:-5}

services:
  prepare-data:
    <<: *common
    command: python -m scripts.prepare_splits --input-dir dataset/slice_mixed --input-dir dataset/slice_traffic --output-dir shared_data/splits
    volumes:
      - ./agentic_ran:/app/agentic_ran
      - ./scripts:/app/scripts
      - ./dataset:/app/dataset
      - ./src:/app/src
      - ./models:/app/models
      - ./policies:/app/policies
      - ./configs:/app/configs
      - ./shared_data:/app/shared_data
      - ./results:/app/results

  benchmark-main:
    <<: *common
    command: python -m src.benchmark --benchmark-scope main

  benchmark-appendix:
    <<: *common
    command: python -m src.benchmark --benchmark-scope appendix

  benchmark-all:
    <<: *common
    command: python -m src.benchmark --benchmark-scope all

  report:
    <<: *common
    command: python -m src.report
