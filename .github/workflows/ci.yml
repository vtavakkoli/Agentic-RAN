name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,oran]"
      - name: Static checks
        run: |
          python -m compileall -q agentic_ran tests
          ruff check --select E9,F63,F7,F82 .
      - name: Tests and coverage
        run: pytest --cov=agentic_ran --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  docker:
    name: Docker build and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime
        run: docker build --target runtime -t agentic-ran:ci .
      - name: Generate, train, and inspect CLI
        run: |
          docker run --rm agentic-ran:ci generate-data --output /tmp/data.csv --rows 180
          docker run --rm agentic-ran:ci --help
          docker run --rm agentic-ran:ci serve-bridge --help
      - name: Validate Compose
        run: docker compose config --quiet
