name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python 3.13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,oran]"
      - name: Static checks
        run: |
          python -m compileall -q agentic_ran tests
          ruff check --select E9,F63,F7,F82 .
      - name: Tests and coverage
        run: pytest --cov=agentic_ran --cov-report=term-missing --cov-report=xml
      - name: Synthetic safe-policy comparison (not COMMAG)
        run: python -m agentic_ran.research_safe_benchmark --episodes 60 --output results/research_safe_synthetic.json
      - name: Upload synthetic comparison
        uses: actions/upload-artifact@v4
        with:
          name: safe-improvement-synthetic-only
          path: results/research_safe_synthetic.json
      - name: Twin-CQL and CVaR action-dependent study (toy, not COMMAG)
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: |
          python -m agentic_ran.research_twin_study --seed 2026 --train-episodes 30 --validation-episodes 8 --test-episodes 12 --steps 12 --output results/twin_cql_cvar_study.json
          test -s results/twin_cql_cvar_study.json
          test -s results/twin_cql_cvar_study_episodes.csv
      - name: Upload toy interventional study
        uses: actions/upload-artifact@v4
        with:
          name: twin-cql-cvar-simulated-only
          path: |
            results/twin_cql_cvar_study.json
            results/twin_cql_cvar_study_episodes.csv
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  ran-gym:
    name: RAN Gym matched-policy smoke (toy only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Gymnasium test dependencies
        run: python -m pip install -e ".[dev,ran-gym]"
      - name: Matched-pair inference and safety regression tests
        run: python -m pytest -q tests/test_ran_gym_benchmark.py
      - name: Gymnasium rollout smoke (not an active 5G test)
        run: |
          python -m agentic_ran.research_ran_gym --config configs/ran_gym_smoke.json --output results/ran-gym-smoke
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("results/ran-gym-smoke/ran_gym_summary.json").read_text())
          assert report["is_toy_smoke"] is True
          assert report["publication_superiority_ready"] is False
          assert report["episodes"] > 0
          PY
      - name: Validate verified native ns-3.49 and external research Compose
        run: docker compose -f docker-compose.ran-gym.yml --profile native --profile external config --quiet
      # Native ns-3.49 C++ compilation and actual UDP packet-control experiments
      # are mandatory in the separate native-verified-ns3-gym.yml workflow.
      - name: Docker test image and Gym smoke
        run: |
          mkdir -p results artifacts
          LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose -f docker-compose.ran-gym.yml build ran-gym-unit ran-gym-smoke
          LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose -f docker-compose.ran-gym.yml run --rm ran-gym-unit
          LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose -f docker-compose.ran-gym.yml run --rm ran-gym-smoke
      - name: Build and run final PPO-WSP/CQL/CVaR Docker environment
        run: |
          LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose -f docker-compose.ran-gym.yml build ran-gym-final-test ran-gym-final-smoke
          LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose -f docker-compose.ran-gym.yml run --rm ran-gym-final-test
          LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose -f docker-compose.ran-gym.yml run --rm ran-gym-final-smoke
          test -s results/ran-gym-final-smoke/gym_final_summary.json
      - name: Campaign Docker train/validate/test smoke and manifest
        run: |
          LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose -f docker-compose.ran-gym.yml run --rm ran-gym-campaign-smoke
          test -s results/ran-gym-campaign-smoke/campaign_summary.json
          test -s results/ran-gym-campaign-smoke/research_report.html
          test -s results/ran-gym-campaign-smoke/artifact_sha256.json
      - name: Upload multi-training-seed campaign smoke
        uses: actions/upload-artifact@v4
        with:
          name: gym-multiseed-TOY-research-smoke
          path: |
            results/ran-gym-campaign-smoke/campaign_summary.json
            results/ran-gym-campaign-smoke/research_report.html
            results/ran-gym-campaign-smoke/artifact_sha256.json
      - name: Upload final-policy toy Gym evidence
        uses: actions/upload-artifact@v4
        with:
          name: final-six-controller-gym-toy-smoke
          path: results/ran-gym-final-smoke/gym_final_summary.json

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  docker:
    name: Docker build and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime
        run: docker build --target runtime -t agentic-ran:ci .
      - name: Generate, train, and inspect CLI
        run: |
          docker run --rm agentic-ran:ci generate-data --output /tmp/data.csv --rows 180
          docker run --rm agentic-ran:ci --help
          docker run --rm agentic-ran:ci serve-bridge --help
      - name: Validate Compose
        run: docker compose config --quiet

  real-data:
    name: Real data / model selection / report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Prepare host directories
        run: mkdir -p data/raw data/prepared results artifacts
      - name: Prepare real data
        run: |
          LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose run --rm --no-deps prepare-data
      - name: Select production candidate model
        run: |
          LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose run --rm --no-deps model-selection
      - name: Generate readiness report
        run: |
          LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose run --rm --no-deps report
      - name: Run test suite in Compose image
        run: |
          LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose --profile test run --rm --no-deps test
      - name: Verify generated evidence
        run: |
          test -s data/prepared/real_measurements.csv.gz
          test -s data/prepared/real_policy_eval.csv.gz
          test -s data/prepared/provenance.json
          test -s results/model_selection.json
          test -s results/report.html
          test -s results/report.json
          grep -q "Agentic-RAN readiness report" results/report.html
      - name: Upload readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: real-data-readiness-report
          path: |
            data/prepared/provenance.json
            results/model_selection.json
            results/report.html
            results/report.json
      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans

  commag:
    name: COMMAG / offline Fitted-Q / held-out test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AGENTIC_RAN_COMMAG_BASE_STATIONS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Prepare host directories
        run: mkdir -p data/raw/commag data/prepared/commag results artifacts
      - name: Prepare the pinned COMMAG core
        run: |
          LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose --profile commag run --rm --no-deps commag-prepare
      - name: Train on exp1 and evaluate on exp2
        run: |
          LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose --profile commag run --rm --no-deps commag-train
      - name: Validate generated evidence
        run: |
          LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose --profile commag run --rm --no-deps commag-test
      - name: Verify generated evidence
        run: |
          test -s data/prepared/commag/commag_transitions.csv.gz
          test -s data/prepared/commag/commag_manifest.json
          test -s results/commag_benchmark.json
          test -s results/commag_report.html
          grep -q "COMMAG benchmark report" results/commag_report.html
      - name: Upload COMMAG evidence
        uses: actions/upload-artifact@v4
        with:
          name: commag-offline-rl-report
          path: |
            data/prepared/commag/commag_manifest.json
            results/commag_benchmark.json
            results/commag_report.html
      - name: Cleanup
        if: always()
        run: docker compose --profile commag down -v --remove-orphans

  ppo-wsp:
    name: Experimental PPO/WSP smoke / Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install opt-in PPO dependencies
        run: python -m pip install -e ".[dev,ppo,ran-gym]"
      - name: PPO and sparse-edit regression tests
        run: python -m pytest -q tests/test_research_ppo_wsp.py
      - name: Final algorithms Gymnasium regression test
        run: python -m pytest -q tests/test_ran_gym_final_algorithms.py
      - name: Multi-training-seed inference and artifact regression tests
        run: python -m pytest -q tests/test_ran_gym_campaign.py
      - name: Short action-dependent toy smoke test
        run: |
          python -m agentic_ran.research_ppo_wsp \
            --seed 2026 --ppo-updates 2 --episodes-per-update 3 \
            --validation-episodes 4 --test-episodes 4 \
            --steps 5 --rounds 1 --output results/ppo-wsp-smoke
          test -s results/ppo-wsp-smoke/ppo_wsp_summary.json
      - name: Final algorithms Gymnasium matched held-out smoke
        run: |
          python -m agentic_ran.research_ran_gym_final_algorithms \
            --output results/ran-gym-final-smoke \
            --ppo-updates 1 --episodes-per-update 2 \
            --logged-episodes 12 --validation-episodes 4 \
            --test-seeds 4 --steps 5 --wsp-rounds 1 --critic-iterations 1
          test -s results/ran-gym-final-smoke/gym_final_summary.json
