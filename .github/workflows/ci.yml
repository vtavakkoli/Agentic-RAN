name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,oran]"
      - name: Static checks
        run: |
          python -m compileall -q agentic_ran tests
          ruff check --select E9,F63,F7,F82 .
      - name: Tests and coverage
        run: pytest --cov=agentic_ran --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  docker:
    name: Docker build and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime
        run: docker build --target runtime -t agentic-ran:ci .
      - name: Generate, train, and inspect CLI
        run: |
          docker run --rm agentic-ran:ci generate-data --output /tmp/data.csv --rows 180
          docker run --rm agentic-ran:ci --help
          docker run --rm agentic-ran:ci serve-bridge --help
      - name: Validate Compose
        run: docker compose config --quiet

  real-data:
    name: Real data / model selection / report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Prepare host directories
        run: mkdir -p data/raw data/prepared results artifacts
      - name: Prepare real data
        run: |
          LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose run --rm --no-deps prepare-data
      - name: Select production candidate model
        run: |
          LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose run --rm --no-deps model-selection
      - name: Generate readiness report
        run: |
          LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose run --rm --no-deps report
      - name: Run test suite in Compose image
        run: |
          LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose --profile test run --rm --no-deps test
      - name: Verify generated evidence
        run: |
          test -s data/prepared/real_measurements.csv.gz
          test -s data/prepared/real_policy_eval.csv.gz
          test -s data/prepared/provenance.json
          test -s results/model_selection.json
          test -s results/report.html
          test -s results/report.json
          grep -q "Agentic-RAN readiness report" results/report.html
      - name: Upload readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: real-data-readiness-report
          path: |
            data/prepared/provenance.json
            results/model_selection.json
            results/report.html
            results/report.json
      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans

  commag:
    name: COMMAG / offline Fitted-Q / held-out test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AGENTIC_RAN_COMMAG_BASE_STATIONS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Prepare host directories
        run: mkdir -p data/raw/commag data/prepared/commag results artifacts
      - name: Prepare the pinned COMMAG core
        run: |
          LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose --profile commag run --rm --no-deps commag-prepare
      - name: Train on exp1 and evaluate on exp2
        run: |
          LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose --profile commag run --rm --no-deps commag-train
      - name: Validate generated evidence
        run: |
          LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose --profile commag run --rm --no-deps commag-test
      - name: Verify generated evidence
        run: |
          test -s data/prepared/commag/commag_transitions.csv.gz
          test -s data/prepared/commag/commag_manifest.json
          test -s results/commag_benchmark.json
          test -s results/commag_report.html
          grep -q "COMMAG benchmark report" results/commag_report.html
      - name: Upload COMMAG evidence
        uses: actions/upload-artifact@v4
        with:
          name: commag-offline-rl-report
          path: |
            data/prepared/commag/commag_manifest.json
            results/commag_benchmark.json
            results/commag_report.html
      - name: Cleanup
        if: always()
        run: docker compose --profile commag down -v --remove-orphans
