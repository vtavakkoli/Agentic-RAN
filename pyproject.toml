[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentic-ran"
version = "2.0.0"
description = "Safety-governed agentic O-RAN intelligence with world-model planning, uncertainty gates, xApp/rApp adapters, and reproducible benchmarks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vahid Tavakkoli" }]
keywords = ["agentic-ai", "ai-ran", "o-ran", "5g", "6g", "xapp", "rapp", "digital-twin", "network-slicing", "safe-ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.6,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
oran = [
  "websocket-client>=1.8,<2",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
agentic-ran = "agentic_ran.cli:main"

[project.urls]
Homepage = "https://github.com/vtavakkoli/Agentic-RAN"
Repository = "https://github.com/vtavakkoli/Agentic-RAN"
Issues = "https://github.com/vtavakkoli/Agentic-RAN/issues"

[tool.hatch.build.targets.wheel]
packages = ["agentic_ran"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["agentic_ran"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# v2 introduces transport/hardware integration boundaries that are not safely
# exercised as live RAN infrastructure in GitHub Actions. Keep the CI threshold
# just below the measured v2 baseline (58.74%) and ratchet it upward as adapter
# integration tests are added, rather than fabricating protocol coverage.
fail_under = 58

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["data/runtime", "artifacts", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
